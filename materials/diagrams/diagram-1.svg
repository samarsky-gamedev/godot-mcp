<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650"><rect width="1200" height="650" fill="white"/><g font-family="Arial" font-size="24" fill="#183746" stroke="#385e70"><rect x="260" y="35" width="680" height="570" fill="none"/><text x="600" y="80" text-anchor="middle" stroke="none">MCP сервер для игрового движка Godot</text><rect x="20" y="280" width="200" height="75" fill="#edf4f7"/><text x="120" y="325.5" text-anchor="middle" stroke="none">Разработчик</text><rect x="970" y="280" width="210" height="75" fill="#edf4f7"/><text x="1075" y="325.5" text-anchor="middle" stroke="none">MCP клиент</text><ellipse cx="600" cy="160" rx="240" ry="40" fill="#edf4f7"/><text x="600" y="168" text-anchor="middle" stroke="none">Создать и изменить сцену</text><path d="M220,318 L360,160" fill="none" stroke-width="2"/><path d="M840,160 L970,318" fill="none" stroke-width="2"/><ellipse cx="600" cy="270" rx="240" ry="40" fill="#edf4f7"/><text x="600" y="278" text-anchor="middle" stroke="none">Прочитать структуру сцены</text><path d="M220,318 L360,270" fill="none" stroke-width="2"/><path d="M840,270 L970,318" fill="none" stroke-width="2"/><ellipse cx="600" cy="380" rx="240" ry="40" fill="#edf4f7"/><text x="600" y="388" text-anchor="middle" stroke="none">Запустить проверку</text><path d="M220,318 L360,380" fill="none" stroke-width="2"/><path d="M840,380 L970,318" fill="none" stroke-width="2"/><ellipse cx="600" cy="490" rx="240" ry="40" fill="#edf4f7"/><text x="600" y="498" text-anchor="middle" stroke="none">Получить логи и статус</text><path d="M220,318 L360,490" fill="none" stroke-width="2"/><path d="M840,490 L970,318" fill="none" stroke-width="2"/><text x="600" y="635" text-anchor="middle" stroke="none">Разработчик работает через клиент; модель находится вне сервера</text></g></svg>